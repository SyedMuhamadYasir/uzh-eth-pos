name: Temporary UZH PoS Contabo RPC read-only probe

on:
  push:
    branches:
      - build/macos-dual-arch-2026-10-06
    paths:
      - .github/workflows/temporary-contabo-rpc-probe.yml

permissions:
  contents: read

jobs:
  external-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check external JSON-RPC and Beacon reachability
        shell: bash
        run: |
          set +e
          set +o pipefail
          echo "== UZH PoS external read-only probe =="
          date -Is

          rpc_probe() {
            local label="$1" url="$2" method="$3" body rc meta
            echo
            echo "TARGET=$label"
            echo "URL=$url"
            echo "METHOD=$method"
            body="/tmp/uzh_rpc_body_${BASHPID}"
            meta="$(curl --noproxy '*' -sS --connect-timeout 4 --max-time 10 \
              -H 'Content-Type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"method\":\"$method\",\"params\":[],\"id\":1}" \
              -o "$body" -w 'HTTP=%{http_code} CONNECT=%{time_connect} TOTAL=%{time_total}' \
              "$url" 2>&1)"
            rc=$?
            echo "CURL_RC=$rc $meta"
            if [[ -s "$body" ]]; then
              head -c 1000 "$body"
              echo
            fi
            rm -f "$body"
          }

          for method in eth_chainId eth_syncing eth_blockNumber; do
            rpc_probe 'CONTABO-18549' 'http://157.173.125.128:18549' "$method"
          done

          rpc_probe 'KNOWN-WORKING-DAO-HTTPS' 'https://dao-rpc.130-60-24-234.sslip.io/' 'eth_chainId'

          echo
          echo 'TARGET=CONTABO-BEACON-18005'
          curl --noproxy '*' -sS --connect-timeout 4 --max-time 10 \
            -w '\nHTTP=%{http_code} CONNECT=%{time_connect} TOTAL=%{time_total}\n' \
            'http://157.173.125.128:18005/eth/v1/node/syncing' | head -c 1000
          echo

          echo
          echo '== TCP socket check (read only) =='
          for port in 18549 18005 18555; do
            printf 'PORT=%s ' "$port"
            timeout 6 bash -c "echo > /dev/tcp/157.173.125.128/$port" >/dev/null 2>&1 \
              && echo OPEN || echo 'CLOSED_OR_FILTERED'
          done
          echo '== END =='
